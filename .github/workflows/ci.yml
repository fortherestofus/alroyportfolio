name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The PRD §12b automated gates, same order as `npm run qa`.
      - name: TypeScript check
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Token lint (no hardcoded colors, sizes or weights)
        run: npm run lint:tokens

      - name: Prettier
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Link check
        run: npm run check:links

      # Deployment is a local step: `npm run deploy` publishes dist/ to
      # the `deploy` branch, which Hostinger pulls. This artifact is just
      # for inspecting what CI produced.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 14
